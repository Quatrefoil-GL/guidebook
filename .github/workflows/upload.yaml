name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: corepack enable && corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Validate Calcit project
      run: |
        set -euo pipefail
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit edit format
        git diff --exit-code -- calcit.cirru
        calcit --check-only --all-defs --format json
        calcit fix --workflow strict --verify

    - name: Select frontend CDN path
      id: assets
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "base-url=https://cos-sh.tiye.me/$prefix" >> "$GITHUB_OUTPUT"

    - name: "compiles to js"
      env:
        VITE_BASE_URL: ${{ steps.assets.outputs.base-url }}
      run: calcit js && yarn vite build --base="$VITE_BASE_URL"

    - name: Check COS credentials
      id: cos
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          echo "::error::Production deployment requires COS credentials."
          exit 1
        else
          echo "::warning::COS preview skipped: configure COS credentials."
        fi

    - name: Upload and verify frontend assets
      if: steps.cos.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.assets.outputs.prefix }}
        public-base-url: ${{ steps.assets.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"


    # also need to upload mddook

    - uses: supplypike/setup-bin@v3
      with:
        uri: 'https://github.com/rust-lang/mdBook/releases/download/v0.4.14/mdbook-v0.4.14-x86_64-unknown-linux-gnu.tar.gz'
        name: 'mdbook'
        version: '0.4.14'

    - uses: supplypike/setup-bin@v3
      with:
        uri: 'https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.6/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip'
        name: 'mdbook-linkcheck'
        version: '0.7.6'

    - name: mdbook build
      run: mdbook build && mv -v book/html/index.html book/html/mdbook.html

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy-mdbook
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'book/html/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-mdbook.outputs.status }}"
