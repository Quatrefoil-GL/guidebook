name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: corepack enable && corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"
        deps-file: deps.cirru

    - name: Validate Calcit project
      run: |
        set -euo pipefail
        test ! -e compact.cirru
        test ! -e package.cirru
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit edit format
        git diff --exit-code -- calcit.cirru
        calcit --check-only --all-defs --format json
        calcit --check-only --ns app.config --ns app.main --ns app.schema --ns app.updater --summary-only --format json
        calcit fix --workflow strict --verify --format json | jq -e '{workflow:.data.workflow,diagnostics:.diagnostics} | ., (.workflow.status == "passed" and .diagnostics == [])'

    - name: Select frontend CDN path
      id: assets
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/"
        else
          prefix="${GITHUB_REPOSITORY}/"
        fi
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "base-url=https://cos-sh.tiye.me/$prefix" >> "$GITHUB_OUTPUT"

    - name: "compiles to js"
      env:
        VITE_BASE_URL: ${{ steps.assets.outputs.base-url }}
      run: calcit js && yarn vite build --base="$VITE_BASE_URL"

    - name: Check COS credentials
      id: cos
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        COS_BUCKET: ${{ secrets.COS_BUCKET }}
        COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
        COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
      run: |
        if [[ -n "$COS_BUCKET" && -n "$COS_SECRET_ID" && -n "$COS_SECRET_KEY" ]]; then
          echo "available=true" >> "$GITHUB_OUTPUT"
        elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
          echo "::error::Production deployment requires COS credentials."
          exit 1
        else
          echo "::warning::COS preview skipped: configure COS credentials."
        fi

    - name: Upload and verify frontend assets
      if: steps.cos.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.assets.outputs.prefix }}
        public-base-url: ${{ steps.assets.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Install verified mdBook binaries
      run: |
        install -d "$RUNNER_TEMP/mdbook-bin"
        curl --fail --location --silent --show-error --output "$RUNNER_TEMP/mdbook.tar.gz" \
          https://github.com/rust-lang/mdBook/releases/download/v0.4.14/mdbook-v0.4.14-x86_64-unknown-linux-gnu.tar.gz
        echo "0ed75f6e4115f02d806932c4b1a8d9aca276ea1bbc3979524b4a8847bd3510e4  $RUNNER_TEMP/mdbook.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP/mdbook-bin" mdbook
        curl --fail --location --silent --show-error --output "$RUNNER_TEMP/linkcheck.zip" \
          https://github.com/Michael-F-Bryan/mdbook-linkcheck/releases/download/v0.7.6/mdbook-linkcheck.x86_64-unknown-linux-gnu.zip
        echo "2c478d9754e38be2dbd3ee2fcac629179c6d6146f7e0f1749a5a697030e27c4a  $RUNNER_TEMP/linkcheck.zip" | sha256sum --check --strict
        unzip -q "$RUNNER_TEMP/linkcheck.zip" -d "$RUNNER_TEMP/mdbook-bin"
        chmod +x "$RUNNER_TEMP/mdbook-bin/mdbook" "$RUNNER_TEMP/mdbook-bin/mdbook-linkcheck"
        echo "$RUNNER_TEMP/mdbook-bin" >> "$GITHUB_PATH"

    - name: mdbook build
      env:
        MDBOOK_OUTPUT__HTML__SITE_URL: ${{ steps.assets.outputs.base-url }}
      run: mdbook build && mv -v book/html/index.html book/html/mdbook.html

    - name: Save PR frontend preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: quatrefoil-guidebook-preview
        path: |
          dist
          book/html
        if-no-files-found: error
        retention-days: 7

    - name: Upload and verify mdBook
      if: steps.cos.outputs.available == 'true'
      uses: worktools/cos-upload-action@v1.2.0
      with:
        source-dir: book/html
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.assets.outputs.prefix }}
        public-base-url: ${{ steps.assets.outputs.base-url }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Deploy frontend to original server directory
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy-mdbook
      uses: Pendect/action-rsyncer@v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'book/html/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy-mdbook.outputs.status }}"
